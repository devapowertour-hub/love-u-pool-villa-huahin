<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ปฏิทินห้องว่าง - Love U Pool Villa Hua Hin</title>
    <style>
        :root {
            --primary: #0d9488;
            --primary-dark: #0f766e;
            --bg-light: #f8fafc;
            --text-main: #334155;
            --border-color: #e2e8f0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-light);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }
        .header-banner {
            background: linear-gradient(135deg, #0d9488, #115e59);
            color: white;
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 24px;
        }
        .header-banner h1 { margin: 0 0 8px 0; font-size: 24px; }
        .header-banner p { margin: 0; opacity: 0.9; font-size: 14px; }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 10px;
            text-align: center;
        }
        .stat-card .num { font-size: 24px; font-weight: bold; color: var(--primary); }
        .stat-card .label { font-size: 13px; color: #64748b; margin-top: 4px; }

        .calendar-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .calendar-nav button {
            background: white;
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            color: var(--text-main);
        }
        .calendar-nav button:hover { background: #f1f5f9; }
        .calendar-nav h2 { margin: 0; font-size: 20px; }

        .legend {
            display: flex;
            gap: 16px;
            font-size: 13px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; }
        .dot-free { background: #10b981; }
        .dot-holiday { background: #f59e0b; }
        .dot-busy { background: #ef4444; }

        .grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }
        .dow {
            text-align: center;
            font-weight: bold;
            font-size: 13px;
            color: #64748b;
            padding: 8px 0;
        }
        .day {
            min-height: 90px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            font-size: 12px;
            background: white;
        }
        .day.empty { border: none; background: transparent; }
        .day.today { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(13, 148, 136, 0.2); }
        .day .num { font-weight: bold; font-size: 14px; }
        
        .free-d { background: #ecfdf5; border-color: #a7f3d0; color: #065f46; }
        .busy-d { background: #fef2f2; border-color: #fecaca; color: #991b1b; }
        .special-d { background: #fffbeb; border-color: #fde68a; color: #92400e; }
        .past-d { background: #f1f5f9; border-color: #e2e8f0; color: #94a3b8; }

        .tag {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
            text-align: center;
            font-weight: 500;
        }
        .free-d .tag { background: #d1fae5; color: #047857; }
        .busy-d .tag { background: #fee2e2; color: #b91c1c; }
        .special-d .tag { background: #fef3c7; color: #b45309; }
        .past-d .tag { background: #e2e8f0; color: #64748b; }
        
        .who { font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }

        .free-ranges {
            margin-top: 24px;
            padding: 16px;
            background: #f8fafc;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        .free-ranges h3 { margin: 0 0 10px 0; font-size: 15px; }
        .chips-container { display: flex; flex-wrap: wrap; gap: 8px; }
        .chip {
            background: #ecfdf5;
            border: 1px solid #a7f3d0;
            color: #065f46;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .chip small { background: #10b981; color: white; padding: 1px 5px; border-radius: 4px; font-size: 10px; }
        .err { background: #fee2e2; color: #b91c1c; padding: 12px; border-radius: 8px; margin-bottom: 16px; font-size: 13px; }
        .alert-banner { background: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af; padding: 12px; border-radius: 8px; margin-bottom: 16px; font-size: 13px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-banner">
        <h1>LOVE U POOL VILLA HUA HIN</h1>
        <p>ปฏิทินห้องว่าง ตรวจสอบวันว่างและวันหยุดได้ทันที สนใจวันไหนทักมาได้เลยค่ะ</p>
    </div>

    <div id="checkInAlert"></div>
    <div id="errBox"></div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="num" id="sBusy">0</div>
            <div class="label">จองแล้ว (วัน)</div>
        </div>
        <div class="stat-card">
            <div class="num" id="sFree">0</div>
            <div class="label">ว่าง • จองได้</div>
        </div>
        <div class="stat-card">
            <div class="num" id="sAll">0</div>
            <div class="label">วันทั้งหมด</div>
        </div>
        <div class="stat-card">
            <div class="num" id="sRate">0.0%</div>
            <div class="label">อัตราเข้าพัก</div>
        </div>
    </div>

    <div class="calendar-nav">
        <button id="prev">&lt; เดือนก่อนหน้า</button>
        <h2 id="title"></h2>
        <button id="next">เดือนถัดไป &gt;</button>
    </div>

    <div class="legend">
        <div class="legend-item"><div class="dot dot-free"></div><span>ว่างปกติ</span></div>
        <div class="legend-item"><div class="dot dot-holiday"></div><span>หยุด / นักขัตฤกษ์</span></div>
        <div class="legend-item"><div class="dot dot-busy"></div><span>จองแล้ว</span></div>
    </div>

    <div class="grid" id="grid"></div>

    <div class="free-ranges">
        <h3>ช่วงวันว่างแนะนำ</h3>
        <div class="chips-container" id="freeList">กำลังโหลดข้อมูล...</div>
    </div>
</div>

<script>
    // แทนที่ลิงก์ด้านล่างนี้ด้วยลิงก์ Google Sheets CSV ของคุณ
    const SHEET_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRYImqwysptxh2tY3S1x-A5NkYVQmCeKkmpoW5rBHgLScWpTtssy3aKWCDb2dzMafIHs7quW3_5rQRn/pub?output=csv";

    const TH_MONTH = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
    const DOW = ["อาทิตย์", "จันทร์", "อังคาร", "พุธ", "พฤหัสบดี", "ศุกร์", "เสาร์"];

    // วันหยุดนักขัตฤกษ์ปี 2026 - 2027
    const TH_HOLIDAYS = {
        // 2026
        "2026-1-1": "วันขึ้นปีใหม่", "2026-3-3": "วันมาฆบูชา", "2026-4-6": "วันจักรี",
        "2026-4-13": "วันสงกรานต์", "2026-4-14": "วันสงกรานต์", "2026-4-15": "วันสงกรานต์",
        "2026-5-1": "วันแรงงาน", "2026-5-4": "วันฉัตรมงคล", "2026-5-31": "วันวิสาขบูชา",
        "2026-7-28": "วันเฉลิมฯ ร.10", "2026-7-29": "วันอาสาฬหบูชา", "2026-7-30": "วันเข้าพรรษา",
        "2026-8-12": "วันแม่แห่งชาติ", "2026-10-13": "วันนวมินทรมหาราช", "2026-10-23": "วันปิยมหาราช",
        "2026-12-5": "วันพ่อแห่งชาติ", "2026-12-7": "ชดเชยวันพ่อ", "2026-12-10": "วันรัฐธรรมนูญ", "2026-12-31": "วันสิ้นปี",
        // 2027
        "2027-1-1": "วันขึ้นปีใหม่", "2027-2-21": "วันมาฆบูชา", "2027-2-22": "ชดเชยวันมาฆบูชา",
        "2027-4-6": "วันจักรี", "2027-4-13": "วันสงกรานต์", "2027-4-14": "วันสงกรานต์", "2027-4-15": "วันสงกรานต์",
        "2027-5-1": "วันแรงงาน", "2027-5-3": "ชดเชยวันแรงงาน", "2027-5-4": "วันฉัตรมงคล", "2027-5-20": "วันวิสาขบูชา",
        "2027-6-3": "วันเฉลิมฯ พระราชินี", "2027-7-18": "วันอาสาฬหบูชา", "2027-7-19": "วันเข้าพรรษา",
        "2027-7-28": "วันเฉลิมฯ ร.10", "2027-8-12": "วันแม่แห่งชาติ", "2027-10-13": "วันนวมินทรมหาราช",
        "2027-10-23": "วันปิยมหาราช", "2027-12-5": "วันพ่อแห่งชาติ", "2027-12-6": "ชดเชยวันพ่อ",
        "2027-12-10": "วันรัฐธรรมนูญ", "2027-12-31": "วันสิ้นปี"
    };

    let bookings = [];
    let view = new Date();
    view.setDate(1);

    function parseCSV(text) {
        const rows = []; let row = [], cell="", q=false;
        for(let i=0; i<text.length; i++){
            const c = text[i];
            if(q){
                if(c==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else { q=false; } }
                else { cell+=c; }
            } else {
                if(c==='"') q=true;
                else if(c===',') { row.push(cell); cell=""; }
                else if(c==='\n') { row.push(cell); rows.push(row); row=[]; cell=""; }
                else if(c!=='\r') cell+=c;
            }
        }
        if(cell||row.length){ row.push(cell); rows.push(row); }
        return rows.filter(r=>r.some(v=>v.trim()!==""));
    }

    function toDate(s) {
        s = (s||"").trim(); if(!s) return null;
        let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
        if(m) return new Date(+m[1], +m[2]-1, +m[3]);
        m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
        if(m) return new Date(+m[3], +m[2]-1, +m[1]);
        const d = new Date(s); return isNaN(d)?null:d;
    }

    const key = d => d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();

    async function load() {
        try {
            const res = await fetch(SHEET_CSV + "&t=" + Date.now());
            if(!res.ok) throw new Error("HTTP " + res.status);
            const rows = parseCSV(await res.text());
            const iN = 0, iS = 1, iE = 2, iStat = 3;

            bookings = rows.slice(1).map(r=>{
                const s = toDate(r[iS]); if(!s) return null;
                const status = (r[iStat] || "จองแล้ว").trim();
                return {
                    start: s,
                    end: toDate(r[iE])||s,
                    name: (r[iN] || "จองแล้ว").trim(),
                    type: status.includes("วันหยุด") ? "วันหยุด" : "จองแล้ว"
                };
            }).filter(Boolean);

            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const todayK = key(today);

            const todayCheckIns = bookings.filter(b => key(b.start) === todayK && b.type === 'จองแล้ว');
            const alertBox = document.getElementById("checkInAlert");
            if(alertBox) {
                if(todayCheckIns.length > 0){
                    const names = todayCheckIns.map(b => b.name).join(", ");
                    alertBox.innerHTML = `<div class="alert-banner"><span>แจ้งเตือนวันนี้:</span> มีลูกค้าเช็คอินเข้าพัก <b>${names}</b></div>`;
                } else {
                    alertBox.innerHTML = "";
                }
            }
            document.getElementById("errBox").innerHTML = "";
        } catch(e) {
            document.getElementById("errBox").innerHTML = `<div class="err">โหลดข้อมูลไม่สำเร็จ (${e.message}) - ตรวจสอบลิงก์ Google Sheets CSV หรือการแชร์อีกครั้ง</div>`;
        }
        render();
    }

    function render() {
        const grid = document.getElementById("grid");
        grid.innerHTML = "";
        DOW.forEach(d => grid.insertAdjacentHTML("beforeend", `<div class="dow">${d}</div>`));

        const y = view.getFullYear();
        const m = view.getMonth();
        document.getElementById("title").textContent = TH_MONTH[m] + " " + y;

        const map = {};
        for(let k in TH_HOLIDAYS){
            map[k] = { name: TH_HOLIDAYS[k], type: 'วันหยุด' };
        }

        bookings.forEach(b=>{
            for(let d=new Date(b.start); d<=b.end; d.setDate(d.getDate()+1)) {
                map[key(d)] = { name: b.name, type: b.type };
            }
        });

        const first = new Date(y, m, 1).getDay();
        const total = new Date(y, m + 1, 0).getDate();
        let busy = 0, free = 0;
        const freeDays = [];

        for(let i=0; i<first; i++) grid.insertAdjacentHTML("beforeend", '<div class="day empty"></div>');

        const now = new Date();
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const todayK = key(today);

        for(let d=1; d<=total; d++){
            const cur = new Date(y, m, d), k = key(cur), info = map[k];
            const mark = (k === todayK ? " today" : ""), num = String(d).padStart(2,"0");

            if(info && info.type === 'จองแล้ว'){
                busy++;
                grid.insertAdjacentHTML("beforeend", `<div class="day busy-d${mark}"><div class="num">${num}</div><div class="who">${info.name}</div><div class="tag">จองแล้ว</div></div>`);
            } else if(info && info.type === 'วันหยุด'){
                free++; freeDays.push(d);
                grid.insertAdjacentHTML("beforeend", `<div class="day special-d${mark}"><div class="num">${num}</div><div class="who">${info.name}</div><div class="tag">หยุด • นักขัตฤกษ์</div></div>`);
            } else if(cur < today){
                grid.insertAdjacentHTML("beforeend", `<div class="day past-d"><div class="num">${num}</div><div class="tag">ผ่านไปแล้ว</div></div>`);
            } else {
                free++; freeDays.push(d);
                grid.insertAdjacentHTML("beforeend", `<div class="day free-d${mark}"><div class="num">${num}</div><div class="tag">ว่าง • จองได้</div></div>`);
            }
        }

        const rest = (7 - ((first + total) % 7)) % 7;
        for(let i=0; i<rest; i++) grid.insertAdjacentHTML("beforeend", '<div class="day empty"></div>');

        document.getElementById("sBusy").textContent = busy;
        document.getElementById("sFree").textContent = free;
        document.getElementById("sAll").textContent = total;
        document.getElementById("sRate").textContent = (busy / total * 100).toFixed(1) + "%";

        const ranges = [];
        freeDays.forEach(d=>{
            const last = ranges[ranges.length-1];
            if(last && d === last[1]+1) last[1] = d; else ranges.push([d,d]);
        });

        const mn = TH_MONTH[m].slice(0,3)+".";
        document.getElementById("freeList").innerHTML = ranges.length 
            ? ranges.map(r=>`<div class="chip">${r[0]===r[1]?r[0]+" "+mn:r[0]+"-"+r[1]+" "+mn}<small>${r[1]-r[0]+1} วัน</small></div>`).join("")
            : '<div class="chip" style="background:#fdf1e0;border-color:#f6ddb7;color:#a9671a">เดือนนี้เต็มแล้วค่ะ</div>';
    }

    document.getElementById("prev").onclick = () => {
        view = new Date(view.getFullYear(), view.getMonth() - 1, 1);
        render();
    };
    document.getElementById("next").onclick = () => {
        view = new Date(view.getFullYear(), view.getMonth() + 1, 1);
        render();
    };

    load();
</script>

</body>
</html>
