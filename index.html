<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ปฏิทินห้องว่าง LOVE U POOL VILLA</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{--free:#2fa37a;--free-bg:#e6f6f0;--busy:#e08a2e;--busy-bg:#fdf1e0;
--ink:#1d2b2b;--muted:#7b8a8a;--line:#e6ecec;--card:#fff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans Thai',system-ui,sans-serif;background:#f3f8f7;color:var(--ink);padding:28px 16px 60px;line-height:1.6}
.wrap{max-width:980px;margin:0 auto}
.hero{background:linear-gradient(135deg,#0f766e,#14b8a6);border-radius:24px;padding:34px 30px;color:#fff;margin-bottom:20px}
.hero h1{font-size:2rem;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px}
.stat{background:var(--card);border-radius:16px;padding:18px 14px;text-align:center;border:1px solid var(--line)}
.stat .n{font-size:1.7rem;font-weight:700}
.n.free{color:var(--free)}.n.busy{color:var(--busy)}
.cal{background:var(--card);border-radius:22px;padding:26px;border:1px solid var(--line)}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.nav{display:flex;align-items:center;gap:10px}
.nav button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;color:#0f766e}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.dow{text-align:center;font-weight:600;font-size:.85rem;color:#51606a;padding:8px 0}
.day{min-height:90px;border-radius:14px;padding:9px;border:1px solid transparent;display:flex;flex-direction:column;gap:4px}
.day .num{font-weight:600}
.day .tag{font-size:.72rem;font-weight:600;margin-top:auto}
.free-d{background:var(--free-bg);border-color:#cdeade}.free-d .tag{color:var(--free)}
.busy-d{background:var(--busy-bg);border-color:#f6ddb7}.busy-d .tag{color:var(--busy)}.busy-d .who{color:#a9671a;font-size:.68rem}
.past-d{background:#f4f6f6;opacity:.6}.empty{background:#fafbfb}
.loading{text-align:center;padding:40px;color:var(--muted);grid-column:span 7}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero"><h1>ปฏิทินห้องว่าง LOVE U POOL VILLA</h1><p>ตรวจสอบวันว่างได้ที่นี่</p></div>
  <div class="stats">
    <div class="stat"><div class="n busy" id="sBusy">–</div><div>จองแล้ว</div></div>
    <div class="stat"><div class="n free" id="sFree">–</div><div>ว่าง</div></div>
    <div class="stat"><div class="n" id="sAll">–</div><div>ทั้งหมด</div></div>
    <div class="stat"><div class="n" id="sRate">–</div><div>อัตราเข้าพัก</div></div>
  </div>
  <div class="cal">
    <div class="cal-head">
      <div class="nav"><button id="prev">‹</button><h2 id="title">กำลังโหลด…</h2><button id="next">›</button></div>
    </div>
    <div class="grid" id="grid"><div class="loading">กำลังดึงข้อมูล…</div></div>
  </div>
</div>
<script>
const SCRIPT_URL = "วางลิงก์เว็บแอปตรงนี้";

const TH_MONTH=["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
const DOW=["อาทิตย์","จันทร์","อังคาร","พุธ","พฤหัส","ศุกร์","เสาร์"];
let bookings=[], view=new Date(); view.setDate(1);

function toDate(s){
  s=(s||"").trim(); if(!s) return null;
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m) return new Date(+m[1],+m[2]-1,+m[3]);
  const d=new Date(s); return isNaN(d)?null:d;
}
const key=d=>d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate();

async function load(){
  try{
    const res = await fetch(SCRIPT_URL);
    const json = await res.json();
    bookings = json.map(r=>{
      if((r.status||"").trim() !== "จองแล้ว") return null;
      const s = toDate(r.start); if(!s) return null;
      return { start: s, end: toDate(r.end)||s, name: r.name||"จองแล้ว" };
    }).filter(Boolean);
  }catch(e){console.log(e);}
  render();
}

function render(){
  const y=view.getFullYear(), m=view.getMonth();
  document.getElementById("title").textContent=TH_MONTH[m]+" "+y;
  const map={};
  bookings.forEach(b=>{
    for(let d=new Date(b.start); d<=b.end; d.setDate(d.getDate()+1)) {
      map[key(d)]={ name: b.name };
    }
  });
  const now=new Date(), today=new Date(now.getFullYear(),now.getMonth(),now.getDate()), todayK=key(today);
  const grid=document.getElementById("grid"); grid.innerHTML="";
  DOW.forEach(d=>grid.insertAdjacentHTML("beforeend",'<div class="dow">'+d+'</div>'));
  const first=new Date(y,m,1).getDay(), total=new Date(y,m+1,0).getDate();
  let busy=0, free=0;
  for(let i=0;i<first;i++) grid.insertAdjacentHTML("beforeend",'<div class="day empty"></div>');
  for(let d=1;d<=total;d++){
    const cur=new Date(y,m,d), k=key(cur), info=map[k];
    const num=String(d).padStart(2,"0");
    if(info){
      busy++;
      grid.insertAdjacentHTML("beforeend",'<div class="day busy-d"><div class="num">'+num+'</div><div class="who">'+info.name+'</div><div class="tag">จองแล้ว</div></div>');
    } else if(cur<today){
      grid.insertAdjacentHTML("beforeend",'<div class="day past-d"><div class="num">'+num+'</div><div class="tag">ผ่านไปแล้ว</div></div>');
    } else { 
      free++;
      grid.insertAdjacentHTML("beforeend",'<div class="day free-d"><div class="num">'+num+'</div><div class="tag">ว่าง • จองได้</div></div>');
    }
  }
  sBusy.textContent=busy; sFree.textContent=free; sAll.textContent=total;
  sRate.textContent=(busy/total*100).toFixed(1)+"%";
}
document.getElementById("prev").onclick=()=>{view.setMonth(view.getMonth()-1);render();};
document.getElementById("next").onclick=()=>{view.setMonth(view.getMonth()+1);render();};
load();
</script>
</body>
</html>
